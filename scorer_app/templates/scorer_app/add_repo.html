{% extends 'scorer_app/base.html' %}

{% block title %}Добавить репозиторий{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">➕ Добавить репозиторий</h2>
        <p class="text-muted">Введите ссылку на GitHub репозиторий для анализа</p>

        <form method="post" class="mt-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">Добавить</button>
            <a href="/" class="btn btn-secondary">Назад</a>
        </form>
    </div>
</div>
{% endblock %}
